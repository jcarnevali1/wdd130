<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Jean Franco Carnevali | White Water Rafting | Company Contact">
    <meta name="author" content="Jean Franco Carnevali">
    <title>White Water Rafting | Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="White Water Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>White Water Rafting</h1>
        <div class="information">
            <p>123 Main Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </div>
        <div class="grid">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d48152.33455676129!2d-112.21905576747315!3d41.03573635022846!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sco!4v1785450927980!5m2!1sen!2sco"
              width="330" height="330" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
            <form>
                <div class="form-item column2">
                    <label for="fullname">Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder">
                </div>
                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" placeholder="Placeholder">
                </div>
                <div class="form-item column2">
                    <label>Message Purpose</label>
                    <div class="radio-item">
                        <input type="radio" id="general" name="purpose" value="general">
                        <label for="general">General Inquiry</label>
                        <br>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                        <br>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </div>

                <div class="form-item">
                    <label for="feedback">Message:</label>
                    <textarea id="feedback" name="feedback" rows="3"
                      placeholder="Type here..."></textarea>
                </div>

                <div>
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <div class="employees">
            <section>
                <h2>We Are Here To Serve You</h2>
                <div class="employee">
                    <figure>
                        <img src="images/profile.jpg" alt="Employee 1 smiling to the camera">
                        <figcaption class="employee-caption">Jean Franco</figcaption>
                    </figure>
                    <figure>
                        <img src="images/profile.jpg" alt="Employee 2 smiling to the camera">
                        <figcaption class="employee-caption">Franquinho J.R.</figcaption>
                    </figure>
                    <figure>
                        <img src="images/profile.jpg" alt="Employee 3 smiling to the camera">
                        <figcaption class="employee-caption">John Frank C.</figcaption>
                    </figure>
                </div>
            </section>
        </div>

    </main>

    <footer>
        <p>© 2026 | White Water Rafting | Jean Franco Carnevali</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" width="30" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" width="30" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" width="30" alt="Instagram Icon">
            </a>
        </nav>
    </footer>


</body>

</html>
