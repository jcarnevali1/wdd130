<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Jean Franco Carnevali | White Water Rafting | Web Fundamentals">
    <meta name="author" content="Jean Franco Carnevali">
    <title>White Water Rafting | Home</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="White Water Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <div class="hero">
        <img src="images/rafting-banner.webp" alt="Four people paddling a raft.">
        <h1 class="home-image-title">White Water Rafting</h1>
        <div class="hero-message">
            <p>Make memories with White Water Rafting</p>
            <a href="trips.html">Book Now</a>
        </div>
    </div>
    <main>

        <section class="plan-grid">
            <div class="plan-card">
                <img class="icon" src="images/waves.svg" alt="Icon of river waves">
                <br>
                <img class="plan-image" src="images/rafting_1.jpg" alt="Raft in a blue river">
                <figcaption>Blue River</figcaption>
            </div>
            <div class="plan-card">
                <img class="icon" src="images/group.svg" alt="Icon of a group of people">
                <br>
                <img class="plan-image" src="images/rafting_2.jpg"
                  alt="Group of people with rafting equipment">
                <figcaption>Team Activities</figcaption>
            </div>
            <div class="plan-card">
                <img class="icon" src="images/raft.svg" alt="Icon of a raft">
                <br>
                <img class="plan-image" src="images/rafting_3.jpg" alt="Two rafts next to a river">
                <figcaption>Half Day Adventure</figcaption>
            </div>
        </section>


        <br>
        <br>

        <section class="subscribe">
            <form class="newsletter">
                <h2 class="box-title">Monthly Newsletter</h2>
                <div class="newsletter-form">
                    <div class="newsletter-form column2">
                        <label for="fullname">Name:</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Name">
                    </div>
                    <div class="newsletter-form column2">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" placeholder="Email">
                    </div>
                </div>
                <button>Subscribe!</button>
            </form>
        </section>
        <br>
        <section class="contact-info subscribe">
            <div>
                <h2 class="box-title">Contact Information</h2>
            </div>
            <div>
                <br>
                <p>123 Main Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</h>
                <p>info@whitewater.com</p>
            </div>
        </section>


    </main>
    <footer>
        <p>© 2026 | White Water Rafting | Jean Franco Carnevali</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" width="30" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" width="30" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" width="30" alt="Instagram Icon">
            </a>
        </nav>
    </footer>


</body>

</html>
